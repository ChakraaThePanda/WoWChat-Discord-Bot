# =============================================================================
#  WoWChat Discord Bot - Configuration File
#  https://github.com/ChakraaThePanda/WoWChat-Discord-Bot
# =============================================================================
#
#  QUICK START:
#    1. Replace every FILL_ME_IN below (Discord token, WoW server and account),
#       then save this file.
#    2. Run Start WoWChat.bat.
#    That's all the bot needs: /menu works right away. Everything else is
#    optional: add channel IDs to relay chat, and turn features on or off with
#    their "enabled = true" / "enabled = false" switch.
#
#  HOW TO GET IDs:
#    Turn on Developer Mode in Discord: User Settings -> Advanced -> Developer Mode.
#    Then right-click any channel, role, or user and click Copy ID.
#    An ID left at 000000000000000000 means "not set".
#
# =============================================================================


# =============================================================================
#  DISCORD
# =============================================================================

discord {
  # Your Discord bot token.
  # Found at https://discord.com/developers/applications -> your app -> Bot -> Reset Token
  token = "FILL_ME_IN"

  # If a Discord @mention doesn't match any user, whisper the sender to let them know.
  enable_tag_failed_notifications = true

  # Item database used when WoW item links appear in chat.
  # Leave empty to use the default for your server version.
  # Vanilla:   http://classicdb.ch
  # TBC:       http://tbc-twinhead.twinstar.cz
  # WotLK:     http://wotlk-twinhead.twinstar.cz  (or https://www.wowhead.com/wotlk)
  # Cataclysm: http://cata-twinhead.twinstar.cz
  # MoP:       http://mop-shoot.tauri.hu
  item_database = ""

  # How often the guild panels, role sync and inactivity checks update, in minutes.
  # Minimum: 1. Very low values can hit Discord's rate limits.
  featuresUpdateMinutes = 2

  # Discord role IDs that can use Admin Actions in /menu (promote, demote,
  # ignore, ban) and set professions for any character.
  # The bot owner and the Discord server owner can always use them.
  # Leave empty [] to keep it to the owners only.
  commandRoleIds = []
}


# =============================================================================
#  WOW SERVER
# =============================================================================

wow {
  # Windows or Mac. If the bot keeps disconnecting on a server with Warden
  # (anti-cheat), switch to Mac.
  platform = Windows

  # Show the server's Message of the Day as a [SYSTEM] message in Discord.
  enable_server_motd = true

  # Your server connection details (see the version reference below).
  version = 3.3.5
  realmlist = "FILL_ME_IN"
  realm = "FILL_ME_IN"

  # The WoW account the bot logs in with, and its character (in your guild).
  account = "FILL_ME_IN"
  password = "FILL_ME_IN"
  character = "FILL_ME_IN"

  # --------------------------------------------------------------------------
  # Version reference:
  #   Vanilla:   version = 1.12.1
  #   TBC:       version = 2.4.3
  #   WotLK:     version = 3.3.5
  #   Cataclysm: version = 4.3.4
  #   MoP:       version = 5.4.8
  # --------------------------------------------------------------------------
}


# =============================================================================
#  GUILD NOTIFICATIONS
#  Which guild events are posted to Discord, in the Guild chat channel below.
#
#  Available tokens: %user, %target, %rank, %message, %time, %achievement
# =============================================================================

guild {
  online {
    enabled = false
    format = "`[%user] has come online.`"
  }
  offline {
    enabled = false
    format = "`[%user] has gone offline.`"
  }
  promoted {
    enabled = false
    format = "`[%user] has promoted [%target] to [%rank].`"
  }
  demoted {
    enabled = false
    format = "`[%user] has demoted [%target] to [%rank].`"
  }
  joined {
    enabled = true
    format = "`[%user] has joined the guild.`"
  }
  left {
    enabled = true
    format = "`[%user] has left the guild.`"
  }
  removed {
    enabled = true
    format = "`[%target] has been kicked out of the guild by [%user].`"
  }
  motd {
    enabled = false
    format = "`Guild Message of the Day: %message`"
  }
  achievement {
    enabled = true
    format = "%user has earned the achievement %achievement!"
  }
}


# =============================================================================
#  CHAT RELAY
#  Which WoW chats are relayed to which Discord channels.
#  Put a Discord channel ID in place of 000000000000000000 to relay that chat.
#
#  direction:
#    both            - messages go both ways
#    wow_to_discord  - WoW -> Discord only
#    discord_to_wow  - Discord -> WoW only
#
#  wow.type: Guild, Officer, Say, Yell, Emote, System, Channel, Whisper
#
#  Available format tokens: %user, %message, %target (channel name for Channel type)
#
#  discord.show_username_in_wow:
#    true  (default) - Discord name shown in WoW, e.g. [Chakraa]: hello
#    false           - only the message, e.g. hello
#
#  discord.show_tag_in_discord:
#    false (default) - only the character name, e.g. [Bob]: Hello all!
#    true            - adds the linked Discord name, e.g. [@Chakraa/Bob]: Hello all!
#                      (needs the character to be linked; it doesn't ping anyone)
# =============================================================================

chat {
  channels = [

    # Guild chat <-> Discord
    {
      direction = both
      wow {
        type = Guild
        format = "[%user]: %message"
      }
      discord {
        channel = 000000000000000000
        format = "[%user]: %message"
        show_username_in_wow = true
        show_tag_in_discord = true
      }
    }

    # Officer chat <-> Discord
    {
      direction = both
      wow {
        type = Officer
        format = "[%user]: %message"
      }
      discord {
        channel = 000000000000000000
        format = "[%user]: %message"
        show_username_in_wow = true
      }
    }

    # /say -> Discord
    {
      direction = wow_to_discord
      wow {
        type = Say
        format = "[%user]: %message"
      }
      discord {
        channel = 000000000000000000
        format = "[%user]: %message"
      }
    }

    # /yell -> Discord
    {
      direction = wow_to_discord
      wow {
        type = Yell
        format = "[%user]: %message"
      }
      discord {
        channel = 000000000000000000
        format = "[%user]: %message"
      }
    }

    # /emote -> Discord
    {
      direction = wow_to_discord
      wow {
        type = Emote
        format = "%user %message"
      }
      discord {
        channel = 000000000000000000
        format = "%user %message"
      }
    }

    # System messages -> Discord
    {
      direction = wow_to_discord
      wow {
        type = System
      }
      discord {
        channel = 000000000000000000
        format = "[SYSTEM]: %message"
      }
    }

    # Example: a specific in-game channel -> Discord
    # {
    #   direction = wow_to_discord
    #   wow {
    #     type = Channel
    #     channel = "Trade - City"
    #     format = "[%user]: %message"
    #   }
    #   discord {
    #     channel = 000000000000000000
    #     format = "[%target] [%user]: %message"
    #   }
    # }

  ]
}


# =============================================================================
#  MESSAGE FILTERS
#  Messages matching one of these Java regex patterns aren't relayed to Discord.
# =============================================================================

filters {
  enabled = false
  patterns = [
    # Gold/level/item spam
    ".*(?i)(?=.*g.?ld)(?=.*level)(?=.*item).*$"
    # Messages with >> and << (a common spam pattern)
    ".*(?=.*>>)(?=.*<<).*$"
  ]
}


# =============================================================================
#  WHO'S ONLINE
#  Posts and keeps updating a list in Discord of the guild members online,
#  with their level, race, class and zone, e.g.
#    "Symastic (Level 40 Human Warrior in Stranglethorn Vale) (@Chakraa)"
#  Linked characters show their Discord name. A long list is split over
#  several posts.
#
#  channelIds - The Discord channels to post it in
#  ignore     - Character names to leave out of this list and the Guild Roster.
#               The bot's own character is always left out.
# =============================================================================

guildOnlineList {
  enabled = false
  channelIds = [000000000000000000]
  ignore = []
}


# =============================================================================
#  BOT STATUS
#  The bot's Discord status cycles through these messages.
#
#  Tokens:
#    {guild-online-members}  - e.g. "5 Guild Members"
#    {server-online-members} - e.g. "312 Players"
#
#  rotateSeconds - How often the status changes, in seconds (minimum: 5)
# =============================================================================

guildStatus {
  enabled = true
  messages = ["{guild-online-members} online"]
  rotateSeconds = 30
}


# =============================================================================
#  DM AUTO-REPLY
#  When someone sends the bot a direct message, it replies with this text.
#  Supports Discord markdown. Use triple quotes for several lines.
# =============================================================================

dmAutoReply {
  enabled = false
  message = """
Hello!
If you wish to join us, you can click the link below to gain access to our **Discord** server.
## Link
[Discord Link](https://discord.gg/yourlink)
"""
}


# =============================================================================
#  DEATH PING
#  When a guild member dies, the bot adds a role mention to the death message
#  in Discord. The death message has to be relayed (usually through the System
#  messages relay above).
#
#  roleId   - The Discord role to ping
#  patterns - What a death message looks like on your server, as Java regex.
#             Put the player's name in ( ) so only guild members' deaths ping.
# =============================================================================

guildDeathNotifications {
  enabled = false
  roleId = 000000000000000000
  patterns = [
    "\\[Hardcore Death\\] (\\S+)"
    "^(\\S+) has fallen at level"
    "^(\\S+) has been slain by"
  ]
}


# =============================================================================
#  CLASS AND RACE RULES
#  Kicks guild members of these classes or races, every featuresUpdateMinutes.
#  Leave empty [] to allow everyone.
#
#  Classes: Warrior, Paladin, Hunter, Rogue, Priest, Shaman, Mage, Warlock, Druid,
#           Death Knight (WotLK+), Monk (MoP+)
#  Races:   Human, Orc, Dwarf, Night Elf, Undead, Tauren, Gnome, Troll,
#           Blood Elf, Draenei (TBC+), Goblin, Worgen (Cataclysm+), Pandaren (MoP+)
#
#  Example: banned_classes = ["Death Knight", "Warlock"]
# =============================================================================

guildEnforcement {
  banned_classes = []
  banned_races = []
}


# =============================================================================
#  WHISPER INVITE
#  Sends a guild invite to players who whisper the bot a trigger word, or say
#  it in one of the listed in-game channels.
#  The bot's character needs a guild rank that can invite.
#
#  triggers       - Words to listen for (not case sensitive)
#  exactMatch     - true: the message must be exactly a trigger word
#                   false: the message only needs to contain one
#  whisperEnabled - Listen for trigger words in whispers
#  channels       - In-game custom channels to also listen in
#  replyOnBlock   - Whisper back when the player's class or race isn't allowed
# =============================================================================

autoGuildInvite {
  enabled = false
  triggers = ["invite", "join"]
  exactMatch = false
  whisperEnabled = true
  channels = []
  replyOnBlock = false
}


# =============================================================================
#  PROFESSIONS
#  Members set their characters' professions in /menu -> Professions.
#
#  keepHoursAfterLeaving - How many hours a character keeps their professions
#                          after leaving the guild, in case they come back.
#                          0 removes them right away.
# =============================================================================

professions {
  keepHoursAfterLeaving = 1
}


# =============================================================================
#  CHARACTER LINKING AND GUILD PANELS
#  Members link their characters by putting their Discord User ID in their guild
#  note (see /help in Discord).
#
#  Linked characters are used by:
#    - The Guild Roster channel (audit, stats and roster posts)
#    - Role sync (Discord roles that follow guild ranks)
#    - Inactivity tracking
#    - Discord names in Who's Online, Look Up Player and Find Crafters
#    - Professions in /menu (members can only edit their own characters)
#
#  noteLocation - Where members put their Discord ID: "officer" or "public".
#                 For "officer", the bot's character needs a guild rank that can
#                 view officer notes.
# =============================================================================

guildDiscordLinking {
  noteLocation = "officer"

  # ===========================================================================
  # GUILD ROSTER CHANNEL
  # Posts and keeps updating these in one Discord channel, top to bottom:
  #   1. Audit   - officer checklist (see the checks below)
  #   2. Stats   - faction, race, class, level and profession breakdowns
  #   3. Roster  - every guild member, grouped by Discord account. A long
  #                roster is split over several posts.
  #
  # channelIds - The Discord channels to post it in
  # ===========================================================================

  guildRoster {
    channelIds = [000000000000000000]

    # --- Audit ---
    # An officer checklist. Each check below can be turned on by itself.
    audit {
      enabled = false

      # Discord members with one of these roles who haven't linked a character.
      unlinked {
        enabled = false
        roleIds = [000000000000000000]
      }

      # Linked characters at these ranks, ready to be promoted.
      linkedRankPromotion {
        enabled = false
        ranksToCheck = ["Recruit"]
      }

      # Discord members whose characters have different ranks
      # (e.g. their main is "Officer" but an alt is still "Member").
      rankMismatch {
        enabled = false
      }

      # Everyone at these ranks, with their Discord name if linked.
      rankList {
        enabled = false
        ranks = ["Officer", "Member"]
      }

      # Characters who have been at a rank longer than the time set here.
      # The game doesn't tell the bot when someone joined or was promoted, so
      # times start when the bot first sees a character at a rank.
      # Delete data/guild_rank_history.json to restart all timers.
      promotionDue {
        enabled = false

        # true: promote them automatically instead of listing them. The bot's
        # character needs a guild rank that can promote.
        autopromote = false

        # rank, plus daysRequired and/or hoursRequired (they add up)
        ranks = [
          { rank = "Recruit", hoursRequired = 48 },
          { rank = "Member",  daysRequired = 30 },
          { rank = "Veteran", daysRequired = 7, hoursRequired = 12 }
        ]
      }
    }

    # --- Stats ---
    stats {
      enabled = true
      show_faction_distribution = true
      show_race_distribution = true
      show_class_distribution = true
      show_level_distribution = true
      show_professions = true
    }

    # --- Roster ---
    roster {
      enabled = true
      # Also list characters that aren't linked to a Discord account
      showUnlinkedCharacters = true
    }
  }

  # ===========================================================================
  # INACTIVITY TRACKING
  # Gives a Discord role to members whose linked characters have all been
  # offline for inactiveDays. The role is removed when they log back in.
  # Only members with one of the audit's unlinked.roleIds roles are checked.
  # ===========================================================================

  inactivity {
    enabled = false
    inactiveDays = 30
    inactiveRoleId = 000000000000000000
  }

  # ===========================================================================
  # ROLE SYNC
  # Gives Discord roles based on in-game guild rank.
  #
  # guildRank     - The in-game rank name (not case sensitive)
  # discordRoleId - The Discord role to give
  # ===========================================================================

  roleSync {
    enabled = false
    ranks = [
      { guildRank = "Member",  discordRoleId = 000000000000000000 },
      { guildRank = "Officer", discordRoleId = 000000000000000000 }
    ]
  }
}


